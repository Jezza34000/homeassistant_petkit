set_feeding_schedule:
  name: Set feeding schedule
  description: >
    Replace the full feeding schedule on a Petkit feeder.
    Prefer OpenPetBowl `schedule` (ISO weekdays, values[]).
    Legacy `feed_daily_list` is still accepted (OEM repeats 1=Sunday).
  fields:
    device_id:
      name: Device ID
      description: The numeric Petkit device ID of the feeder.
      required: true
      example: 10014481
      selector:
        number:
          min: 1
          mode: box
    schedule:
      name: Schedule
      description: >
        OpenPetBowl rows. Each row has hour, minute, values (one or two hopper
        amounts), optional ISO weekdays (1=Mon … 7=Sun), optional label, optional key.
      required: false
      selector:
        object:
    feed_daily_list:
      name: Feed daily list
      description: >
        Legacy OEM 7-day list. Each day has a repeats value (1=Sunday … 7=Saturday),
        a suspended flag (0=active, 1=suspended), and an items list.
      required: false
      selector:
        object:

add_feeding_schedule_entry:
  name: Add feeding schedule entry
  description: Add one meal to the recurring plan (full SAVE_FEED after merge).
  fields:
    device_id:
      name: Device ID
      required: true
      selector:
        number:
          min: 1
          mode: box
    hour:
      name: Hour
      required: true
      selector:
        number:
          min: 0
          max: 23
          mode: box
    minute:
      name: Minute
      required: true
      selector:
        number:
          min: 0
          max: 59
          mode: box
    values:
      name: Values
      description: Hopper amounts. Length must match capabilities.compartments.
      required: true
      selector:
        object:
    weekdays:
      name: Weekdays
      description: ISO weekdays 1=Monday … 7=Sunday. Omit for every day.
      required: false
      selector:
        object:
    label:
      name: Label
      required: false
      selector:
        text:

edit_feeding_schedule_entry:
  name: Edit feeding schedule entry
  description: Update one meal by key (full SAVE_FEED after merge).
  fields:
    device_id:
      name: Device ID
      required: true
      selector:
        number:
          min: 1
          mode: box
    key:
      name: Key
      required: true
      selector:
        text:
    hour:
      name: Hour
      required: true
      selector:
        number:
          min: 0
          max: 23
          mode: box
    minute:
      name: Minute
      required: true
      selector:
        number:
          min: 0
          max: 59
          mode: box
    values:
      name: Values
      required: true
      selector:
        object:
    weekdays:
      name: Weekdays
      required: false
      selector:
        object:
    label:
      name: Label
      required: false
      selector:
        text:

remove_feeding_schedule_entry:
  name: Remove feeding schedule entry
  description: Remove one meal by key (full SAVE_FEED after merge).
  fields:
    device_id:
      name: Device ID
      required: true
      selector:
        number:
          min: 1
          mode: box
    key:
      name: Key
      required: true
      selector:
        text:

skip_feeding_today:
  name: Skip feeding today
  description: Cancel today's occurrence of a scheduled meal (remove_dailyfeed).
  fields:
    device_id:
      name: Device ID
      required: true
      selector:
        number:
          min: 1
          mode: box
    key:
      name: Key
      required: true
      selector:
        text:

unskip_feeding_today:
  name: Unskip feeding today
  description: Restore today's occurrence of a scheduled meal (restore_dailyfeed).
  fields:
    device_id:
      name: Device ID
      required: true
      selector:
        number:
          min: 1
          mode: box
    key:
      name: Key
      required: true
      selector:
        text:

set_feeding_plan_weekdays:
  name: Set feeding plan weekdays
  description: >-
    Set which weekdays the whole feeding plan runs on. Fresh Element (D1) and
    Mini only: these share one plan-level weekday mask across every meal, the
    same control the PetKit app shows as "Repeat". On D3/D4-class feeders set
    weekdays per meal instead, with add/edit_feeding_schedule_entry.
  fields:
    device_id:
      name: Device ID
      required: true
      selector:
        number:
          min: 1
          mode: box
    weekdays:
      name: Weekdays
      description: >-
        ISO weekdays the plan runs on: 1 is Monday through 7 is Sunday. At
        least one is required; an empty plan mask is rejected.
      required: true
      example: "[1, 3, 5]"
      selector:
        select:
          multiple: true
          options:
            - label: Monday
              value: "1"
            - label: Tuesday
              value: "2"
            - label: Wednesday
              value: "3"
            - label: Thursday
              value: "4"
            - label: Friday
              value: "5"
            - label: Saturday
              value: "6"
            - label: Sunday
              value: "7"

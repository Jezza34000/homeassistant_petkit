---
name: "Bug report"
description: "Report a bug with the integration"
labels:
  - "Bug"
body:
  - type: markdown
    attributes:
      value: Before you open a new issue, search through the existing issues to see if others have had the same problem.

  - type: textarea
    attributes:
      label: "System Health details"
      description: "Paste the data from the System Health card in Home Assistant (https://www.home-assistant.io/more-info/system-health#github-issues)"
    validations:
      required: true

  - type: input
    validations:
      required: true
    attributes:
      label: Integration version ?
      placeholder: v2.3.0
      description: |
        > Settings -> Devices & Services -> Petkit -> Version is below the integration name ("Latest" is not a version number)

  - type: input
    attributes:
      label: In which region is your Petkit application registered?
      placeholder: France
      description: |
        > This information is useful for login problem, or if the integration does not start at all.

  - type: dropdown
    id: browsers
    attributes:
      label: "Device type"
      description: |
        > What type of device are you experiencing this problem with?
      multiple: true
      options:
        - Feeder
        - Litter
        - Fountain
        - Other
        - All devices

  - type: checkboxes
    attributes:
      label: Checklist
      options:
        - label: I have enabled debug logging for my installation.
          required: true
        - label: This issue only contains 1 issue (if you have multiple issues, open one issue for each issue).
          required: true
        - label: This issue is not a duplicate issue of any [previous issues](https://github.com/Jezaa34000/homeassistant_petkit/issues?q=is%3Aissue+label%3A%22Bug%22+)..
          required: true

  - type: textarea
    attributes:
      label: "Describe the issue"
      description: |
        **⚠️ WARNING :** Do NOT ❌ paste 🤖 AI-generated text here.

        Describe the issue in your own words, short and clear is better than a wall of AI-generated text.

        What did you observe? What did you expect instead?

        If you are not a developer and don't understand Python code, PLEASE do NOT suggest a fix.
        The maintainer has their own AI-tools to investigate and find solutions.

        💡 A simple, honest description of what happened is far more useful than a long AI-generated block of text that you haven't fully read or understood.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Reproduction steps
      description: "Without steps to reproduce, it will be hard to fix. It is very important that you fill out this part. Issues without it will be closed."
      value: |
        1.
        2.
        3.
        ...
    validations:
      required: true

  - type: textarea
    attributes:
      label: "Debug logs"
      description: "To enable debug logs check this https://www.home-assistant.io/integrations/logger/, this **needs** to include _everything_ from startup of Home Assistant to the point where you encounter the issue."
      render: text
    validations:
      required: true

  - type: textarea
    attributes:
      label: "Diagnostics dump"
      description: "Drag the diagnostics dump file here. (see https://www.home-assistant.io/integrations/diagnostics/ for info)"
